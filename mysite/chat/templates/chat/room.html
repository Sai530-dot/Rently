<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - Reelty</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #ffffff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background-color: #ffffff;
        border-bottom: 1px solid #f0f0f0;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }

      .back-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .back-arrow {
        width: 24px;
        height: 24px;
        color: #ff4444;
      }

      .profile-picture {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 16px;
        flex-shrink: 0;
      }

      .contact-info {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .contact-name {
        font-size: 16px;
        font-weight: 600;
        color: #000000;
      }

      .menu-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .menu-dots {
        width: 24px;
        height: 24px;
        color: #ff4444;
        display: flex;
        flex-direction: column;
        gap: 3px;
        justify-content: center;
        align-items: center;
      }

      .menu-dots::before,
      .menu-dots::after {
        content: "";
        width: 4px;
        height: 4px;
        background-color: #ff4444;
        border-radius: 50%;
      }

      .menu-dots::before {
        margin-bottom: 2px;
      }

      /* Match Notification */
      .match-notification {
        text-align: center;
        padding: 8px 16px;
        color: #666666;
        font-size: 14px;
        background-color: #fafafa;
      }

      /* Chat Area */
      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .chat-container::-webkit-scrollbar {
        width: 4px;
      }

      .chat-container::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-container::-webkit-scrollbar-thumb {
        background: #e0e0e0;
        border-radius: 2px;
      }

      /* Message Bubbles */
      .message-wrapper {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 7px;
        width: 100%;
        animation: messageSlideIn 0.3s ease-out;
        opacity: 0;
        animation-fill-mode: forwards;
      }

      @keyframes messageSlideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-wrapper.incoming {
        justify-content: flex-start;
        align-self: flex-start;
        flex-direction: row;
      }

      .message-wrapper.outgoing {
        flex-direction: row-reverse;
        justify-content: flex-end;
        align-self: flex-end;
        margin-left: auto;
        margin-right: 0;
      }

      .message-wrapper.incoming .message-content {
        align-items: flex-start;
      }

      .message-wrapper.outgoing .message-content {
        align-items: flex-end;
      }

      .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 14px;
        flex-shrink: 0;
      }

      .message-wrapper.incoming .message-avatar {
        display: flex;
      }

      .message-wrapper.outgoing .message-avatar {
        display: none;
      }

      .message-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 70%;
      }

      .message-bubble {
        padding: 10px 14px;
        word-wrap: break-word;
        font-size: 15px;
        line-height: 1.4;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      /* Incoming messages - LEFT SIDE - Light gray bubbles */
      .message-wrapper.incoming .message-bubble {
        background-color: #f1f1f1;
        color: #000000;
        border-radius: 16px 16px 16px 4px;
      }

      /* Outgoing messages - RIGHT SIDE - Blue bubbles */
      .message-wrapper.outgoing .message-bubble {
        background-color: #0078ff;
        color: #ffffff;
        border-radius: 16px 16px 4px 16px;
      }

      .message-status {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: #999999;
        padding: 0 4px;
      }

      .message-wrapper.outgoing .message-status {
        justify-content: flex-end;
      }

      .status-icon {
        width: 14px;
        height: 14px;
      }

      .status-text {
        font-size: 12px;
      }

      /* Input Area */
      .input-container {
        padding: 12px 16px;
        background-color: #ffffff;
        border-top: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .message-input-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        background-color: #f5f5f5;
        border-radius: 20px;
        padding: 8px 16px;
      }

      .message-input {
        flex: 1;
        border: none;
        background: none;
        outline: none;
        font-size: 15px;
        color: #000000;
        padding: 0;
      }

      .message-input::placeholder {
        color: #999999;
      }

      .send-button {
        background: none;
        border: none;
        color: #999999;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        transition: color 0.2s;
      }

      .send-button:active,
      .send-button:hover {
        color: #007aff;
      }

      .send-button:disabled {
        color: #cccccc;
        cursor: not-allowed;
      }

      /* Username Setup Modal */
      .username-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .username-modal.active {
        display: flex;
      }

      .modal-content {
        background-color: #ffffff;
        padding: 24px;
        border-radius: 12px;
        width: 90%;
        max-width: 400px;
      }

      .modal-content h2 {
        margin-bottom: 16px;
        font-size: 20px;
        color: #000000;
      }

      .modal-content input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 16px;
      }

      .modal-content button {
        width: 100%;
        padding: 12px;
        background-color: #007aff;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      .modal-content button:hover {
        background-color: #0056b3;
      }

      /* Heart icon for incoming messages */
      .heart-icon {
        width: 16px;
        height: 16px;
        margin-left: 4px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- Username Setup Modal -->
    <div id="username-modal" class="username-modal active">
      <div class="modal-content">
        <h2>Enter Your Name</h2>
        <input
          type="text"
          id="username-input"
          placeholder="Your name"
          maxlength="20"
        />
        <button id="username-submit">Start Chatting</button>
      </div>
    </div>

    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <button class="back-button" onclick="window.history.back()">
          <svg
            class="back-arrow"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </button>
        <div class="profile-picture" id="contact-avatar">
          {{ room_name|slice:":1"|upper }}
        </div>
        <div class="contact-info">
          <div class="contact-name" id="contact-name">
            {{ room_name|title }}
          </div>
        </div>
      </div>
      <button class="menu-button">
        <div class="menu-dots"></div>
      </button>
    </div>

    <!-- Match Notification -->
    <div class="match-notification" id="match-notification">
      You matched with <span id="match-name">{{ room_name|title }}</span> on
      <span id="match-date"></span>.
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chat-container">
      <!-- Messages will be dynamically inserted here -->
    </div>

    <!-- Input Area -->
    <div class="input-container">
      <div class="message-input-wrapper">
        <input
          type="text"
          id="chat-message-input"
          class="message-input"
          placeholder="Type a message ..."
          maxlength="500"
        />
      </div>
      <button id="chat-message-submit" class="send-button">SEND</button>
    </div>

    {{ room_name|json_script:"room-name" }}
    <script>
      // Get room name from Django template
      const roomName = JSON.parse(
        document.getElementById("room-name").textContent
      );
      let currentUsername = localStorage.getItem("chat_username");
      let chatSocket;
      let messageIdCounter = 0;

      // Set match date
      document.getElementById("match-date").textContent =
        new Date().toLocaleDateString("en-US", {
          month: "2-digit",
          day: "2-digit",
          year: "numeric",
        });

      // Username setup
      const usernameModal = document.getElementById("username-modal");
      const usernameInput = document.getElementById("username-input");
      const usernameSubmit = document.getElementById("username-submit");

      if (currentUsername) {
        usernameModal.classList.remove("active");
        initializeChat();
      }

      usernameSubmit.addEventListener("click", function () {
        const username = usernameInput.value.trim();
        if (username) {
          currentUsername = username;
          localStorage.setItem("chat_username", username);
          usernameModal.classList.remove("active");
          initializeChat();
        }
      });

      usernameInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          usernameSubmit.click();
        }
      });

      function initializeChat() {
        // Update contact avatar
        const contactName = roomName;
        document.getElementById("contact-avatar").textContent = contactName
          .charAt(0)
          .toUpperCase();
        document.getElementById("contact-name").textContent =
          contactName.charAt(0).toUpperCase() + contactName.slice(1);

        // Connect to WebSocket
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        chatSocket = new WebSocket(
          protocol + "//" + window.location.host + "/ws/chat/" + roomName + "/"
        );

        chatSocket.onopen = function (e) {
          console.log("WebSocket connection established");
        };

        chatSocket.onmessage = function (e) {
          const data = JSON.parse(e.data);

          // Get and normalize usernames for comparison
          const receivedUsername = (data.username || "").toString().trim();
          const myUsername = (currentUsername || "").toString().trim();

          // Compare usernames (case-insensitive) - only mark as outgoing if they match AND both are not empty
          let isOutgoing = false;
          if (myUsername && receivedUsername) {
            isOutgoing =
              receivedUsername.toLowerCase() === myUsername.toLowerCase();
          } else if (!receivedUsername || receivedUsername === "Anonymous") {
            // If no username or Anonymous, treat as incoming (from someone else)
            isOutgoing = false;
          }

          console.log("Message received:", {
            message: data.message,
            receivedUsername: receivedUsername,
            myUsername: myUsername,
            isOutgoing: isOutgoing,
            rawData: data,
          });

          addMessage(data.message, receivedUsername || "Unknown", isOutgoing);
        };

        chatSocket.onclose = function (e) {
          console.error("Chat socket closed unexpectedly");
          // Optionally reconnect here
        };

        chatSocket.onerror = function (e) {
          console.error("WebSocket error:", e);
        };

        // Message input handlers
        const messageInput = document.getElementById("chat-message-input");
        const sendButton = document.getElementById("chat-message-submit");

        messageInput.addEventListener("keypress", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        sendButton.addEventListener("click", sendMessage);

        // Focus input
        messageInput.focus();

        // Update send button state
        messageInput.addEventListener("input", function () {
          sendButton.disabled = messageInput.value.trim().length === 0;
        });
        sendButton.disabled = true;
      }

      function sendMessage() {
        const messageInput = document.getElementById("chat-message-input");
        const message = messageInput.value.trim();

        if (message && chatSocket.readyState === WebSocket.OPEN) {
          chatSocket.send(
            JSON.stringify({
              message: message,
              username: currentUsername,
            })
          );
          messageInput.value = "";
          document.getElementById("chat-message-submit").disabled = true;
        }
      }

      function addMessage(message, username, isOutgoing) {
        const chatContainer = document.getElementById("chat-container");
        const messageWrapper = document.createElement("div");

        // Explicitly set the class - default to incoming if unsure
        const messageClass = isOutgoing === true ? "outgoing" : "incoming";
        messageWrapper.className = `message-wrapper ${messageClass}`;
        messageWrapper.id = `message-${messageIdCounter++}`;

        console.log("Adding message:", {
          message: message,
          username: username,
          isOutgoing: isOutgoing,
          messageClass: messageClass,
          currentUsername: currentUsername,
        });

        const messageContent = document.createElement("div");
        messageContent.className = "message-content";

        // Show avatar for incoming messages (from others) on the left
        if (!isOutgoing) {
          const avatar = document.createElement("div");
          avatar.className = "message-avatar";
          avatar.textContent =
            username && username.charAt(0)
              ? username.charAt(0).toUpperCase()
              : "?";
          messageWrapper.appendChild(avatar);
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = message;

        messageContent.appendChild(bubble);

        if (isOutgoing) {
          const status = document.createElement("div");
          status.className = "message-status";
          status.innerHTML = `
                    <svg class="status-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/>
                    </svg>
                    <span class="status-text">Sent</span>
                `;
          messageContent.appendChild(status);
        }

        messageWrapper.appendChild(messageContent);

        // Append to container (animation will trigger automatically)
        chatContainer.appendChild(messageWrapper);

        // Force reflow to ensure animation triggers
        messageWrapper.offsetHeight;

        // Scroll to bottom smoothly
        chatContainer.scrollTo({
          top: chatContainer.scrollHeight,
          behavior: "smooth",
        });
      }
    </script>
  </body>
</html>
